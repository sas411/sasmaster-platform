# claude-code-action — write-restricted install
#
# Staged 2026-08-23 per Shiv's explicit instruction: "let it do everything
# except delete and commit code - if it wants to delete or commit
# temporarily flag until i am comfortable to remove this security/safety
# guardrail."
#
# The action has no native "propose a commit, wait for approval" mode — its
# only two states are write-capable (commits/pushes directly, no human
# step on an open PR) or not write-capable at all. This config implements
# Shiv's actual intent the only way the action's design allows: Claude gets
# full read/analyze/comment/review capability, but the tools that could
# commit or delete (Write, Edit, MultiEdit, NotebookEdit, Bash) are
# withheld entirely via --disallowedTools. Anything it "wants" to change
# surfaces as a suggested diff in a PR/issue comment instead of landing
# directly — which functions as the flag-instead-of-act behavior Shiv
# asked for, enforced structurally rather than by asking nicely.
#
# To remove this guardrail later (Shiv's call only): drop the `claude_args`
# line below, or narrow it to disallow only a subset (e.g. keep Bash
# disallowed but allow Write/Edit) once trust is established.
#
# NOT deployed to SaSMaster / sasmaster-status / sasmaster-skills — those
# three are covered by the standing "Shiv pushes himself" rule and this
# decision (which repos, if any, get the write-capable version) needs an
# explicit per-repo call from Shiv, not a default extension of "go forward."

name: Claude Code Action (write-restricted)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: read
  pull-requests: write   # needed to post comments; does NOT grant push
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Structural guardrail — see header comment. Bash is disallowed
          # too: without it, Write/Edit alone don't stop a `git commit`/
          # `git push`/`rm` run through the shell.
          claude_args: "--disallowedTools Write,Edit,MultiEdit,NotebookEdit,Bash"
